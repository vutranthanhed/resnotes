<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr Vu's Research Notes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Garamond', 'Georgia', 'Times New Roman', serif;
            background: #ffffff;
            color: #1a1a1a;
            line-height: 1.7;
        }
        .header {
            background: #ffffff;
            border-bottom: 4px solid #000;
            padding: 50px 20px 40px;
            text-align: center;
        }
        .header h1 {
            font-size: 42px;
            font-weight: 700;
            color: #000;
            margin-bottom: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header p {
            font-size: 18px;
            color: #555;
            font-style: italic;
            font-weight: 300;
        }
        .header .author {
            margin-top: 20px;
            font-size: 16px;
            color: #333;
            font-style: normal;
        }
        .header .author a {
            color: #000;
            text-decoration: none;
            border-bottom: 1px solid #000;
        }
        .header .author a:hover {
            background: #000;
            color: #fff;
            padding: 2px 4px;
        }
        .quote-banner {
            background: #1a1a1a;
            color: #fff;
            padding: 50px 20px;
            text-align: center;
            border-bottom: 4px solid #000;
        }
        .quote-text {
            font-size: 24px;
            font-style: italic;
            max-width: 900px;
            margin: 0 auto 20px;
            line-height: 1.7;
            font-weight: 300;
        }
        .quote-author {
            font-size: 16px;
            color: #ccc;
            font-style: normal;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 20px;
            background: #fafafa;
        }
        .filter-section {
            background: #fff;
            padding: 30px;
            margin-bottom: 40px;
            border: 3px solid #000;
            box-shadow: 8px 8px 0px #000;
        }
        .filter-section h2 {
            font-size: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: #000;
        }
        .filter-bar {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-bar label {
            font-size: 15px;
            color: #000;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .filter-bar select {
            padding: 12px 20px;
            border: 2px solid #000;
            background: #fff;
            font-family: 'Garamond', 'Georgia', serif;
            font-size: 15px;
            color: #000;
            flex: 1;
            min-width: 250px;
            font-weight: 600;
        }
        .filter-bar select:focus {
            outline: none;
            background: #f0f0f0;
        }
        .section-header {
            background: #000;
            color: #fff;
            padding: 20px 30px;
            margin-bottom: 30px;
            border: 3px solid #000;
        }
        .section-header h2 {
            font-size: 22px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 30px;
        }
        .note-card {
            background: #fff;
            border: 3px solid #000;
            padding: 30px;
            transition: all 0.3s;
            cursor: pointer;
            box-shadow: 6px 6px 0px #000;
        }
        .note-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 10px 10px 0px #000;
        }
        .note-category {
            font-size: 12px;
            color: #fff;
            background: #000;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 6px 12px;
            display: inline-block;
            margin-bottom: 15px;
            font-weight: 700;
        }
        .note-title {
            font-size: 20px;
            font-weight: 700;
            color: #000;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .note-meta {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            line-height: 1.5;
        }
        .note-meta strong {
            color: #000;
            font-weight: 600;
        }
        .note-preview {
            font-size: 15px;
            color: #333;
            margin-top: 20px;
            line-height: 1.7;
            border-left: 3px solid #000;
            padding-left: 15px;
            white-space: pre-wrap;
        }
        .read-more {
            display: inline-block;
            margin-top: 20px;
            font-size: 13px;
            color: #fff;
            background: #000;
            padding: 10px 20px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            border: 2px solid #000;
            transition: all 0.2s;
        }
        .read-more:hover {
            background: #fff;
            color: #000;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            overflow-y: auto;
        }
        .modal-content {
            background: #fff;
            max-width: 900px;
            margin: 50px auto;
            padding: 50px;
            position: relative;
            border: 4px solid #000;
            box-shadow: 12px 12px 0px #000;
        }
        .modal-close {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 32px;
            color: #000;
            cursor: pointer;
            background: none;
            border: none;
            font-family: Arial, sans-serif;
            font-weight: 700;
        }
        .modal-close:hover {
            color: #666;
        }
        .modal-category {
            font-size: 12px;
            color: #fff;
            background: #000;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 8px 15px;
            display: inline-block;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .modal-title {
            font-size: 32px;
            font-weight: 700;
            color: #000;
            margin-bottom: 25px;
            border-bottom: 4px solid #000;
            padding-bottom: 20px;
            line-height: 1.3;
        }
        .modal-meta {
            font-size: 15px;
            color: #555;
            margin-bottom: 12px;
            line-height: 1.6;
        }
        .modal-meta strong {
            color: #000;
            font-weight: 700;
        }
        .modal-body {
            font-size: 17px;
            color: #1a1a1a;
            line-height: 1.9;
            margin: 35px 0;
            text-align: justify;
            white-space: pre-wrap;
        }
        .modal-reference {
            background: #f5f5f5;
            padding: 25px;
            border-left: 4px solid #000;
            margin-top: 35px;
        }
        .modal-reference h3 {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            color: #000;
        }
        .modal-reference p {
            font-size: 15px;
            color: #333;
            line-height: 1.7;
        }
        .no-notes {
            text-align: center;
            padding: 80px 20px;
            color: #666;
            font-size: 18px;
            font-style: italic;
        }
        .footer {
            background: #000;
            border-top: 4px solid #000;
            padding: 40px 20px;
            text-align: center;
            margin-top: 80px;
        }
        .footer p {
            color: #fff;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        @media (max-width: 768px) {
            .notes-grid {
                grid-template-columns: 1fr;
            }
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-bar select {
                width: 100%;
            }
            .modal-content {
                margin: 20px;
                padding: 30px;
            }
            .header h1 {
                font-size: 28px;
            }
            .quote-text {
                font-size: 20px;
            }
            .modal-title {
                font-size: 24px;
            }
            .note-card {
                box-shadow: 4px 4px 0px #000;
            }
            .note-card:hover {
                transform: none;
                box-shadow: 4px 4px 0px #000;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1>Dr Vu's Research Notes</h1>
        <p>A curated collection of scholarly insights</p>
        <div class="author">Prepared by Dr Tran Thanh Vu (<a href="mailto:vutranthanh.ed@gmail.com">vutranthanh.ed@gmail.com</a>)</div>
    </div>

    <!-- Quote Banner -->
    <div class="quote-banner" id="quoteBanner">
        <div class="quote-text" id="quoteText">Loading...</div>
        <div class="quote-author" id="quoteAuthor"></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Filter Section -->
        <div class="filter-section">
            <h2>Filter Research Notes</h2>
            <div class="filter-bar">
                <label>Category:</label>
                <select id="categoryFilter" onchange="filterNotes()">
                    <option value="">All Categories</option>
                </select>
            </div>
        </div>

        <!-- Section Header -->
        <div class="section-header">
            <h2>Recent Publications</h2>
        </div>

        <!-- Notes Grid -->
        <div class="notes-grid" id="notesGrid">
            <div class="no-notes">Loading research notes...</div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>&copy; 2026 Dr Vu's Research Notes. All rights reserved.</p>
    </div>

    <!-- Modal -->
    <div class="modal" id="noteModal" onclick="closeModalOnBackground(event)">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="modal-category" id="modalCategory"></div>
            <h2 class="modal-title" id="modalTitle"></h2>
            <div class="modal-meta" id="modalMeta"></div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-reference">
                <h3>Reference</h3>
                <p id="modalReference"></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDhy20YwDQexnH0_qDt7ulbC5aqcnjPPAo",
            authDomain: "drvuresearchnotes.firebaseapp.com",
            databaseURL: "https://drvuresearchnotes-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "drvuresearchnotes",
            storageBucket: "drvuresearchnotes.firebasestorage.app",
            messagingSenderId: "172279052590",
            appId: "1:172279052590:web:215b45beec48acbd86e2bf",
            measurementId: "G-BHDZCJTKS3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let allNotes = [];

        // Load random quote
        function loadQuote() {
            const quotesRef = ref(db, 'quotes');
            onValue(quotesRef, (snapshot) => {
                if (snapshot.exists()) {
                    const quotes = [];
                    snapshot.forEach(child => quotes.push(child.val()));
                    
                    const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
                    document.getElementById('quoteText').textContent = `"${randomQuote.text}"`;
                    document.getElementById('quoteAuthor').textContent = `— ${randomQuote.author}`;
                } else {
                    document.getElementById('quoteText').textContent = '"The pursuit of knowledge is the highest virtue."';
                    document.getElementById('quoteAuthor').textContent = '— Anonymous';
                }
            });
        }

        // Load notes
        function loadNotes() {
            const notesRef = ref(db, 'notes');
            onValue(notesRef, (snapshot) => {
                allNotes = [];
                const categories = new Set();

                if (snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const note = { id: child.key, ...child.val() };
                        allNotes.push(note);
                        if (note.category) categories.add(note.category);
                    });

                    // Sort by timestamp descending
                    allNotes.sort((a, b) => b.timestamp - a.timestamp);

                    // Update category filter
                    const filterSelect = document.getElementById('categoryFilter');
                    filterSelect.innerHTML = '<option value="">All Categories</option>';
                    Array.from(categories).sort().forEach(cat => {
                        filterSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
                    });
                }

                displayNotes(allNotes);
            });
        }

        // Display notes
        function displayNotes(notes) {
            const grid = document.getElementById('notesGrid');

            if (notes.length === 0) {
                grid.innerHTML = '<div class="no-notes">No research notes available.</div>';
                return;
            }

            grid.innerHTML = '';
            notes.forEach(note => {
                const preview = note.content.substring(0, 200) + '...';
                
                grid.innerHTML += `
                    <div class="note-card" onclick="openModal('${note.id}')">
                        <div class="note-category">${note.category}</div>
                        <div class="note-title">${note.title}</div>
                        <div class="note-meta"><strong>Authors:</strong> ${note.authors}</div>
                        <div class="note-meta"><strong>Journal:</strong> ${note.journal}, ${note.year}</div>
                        <div class="note-preview">${preview}</div>
                        <span class="read-more">Read Full Note →</span>
                    </div>
                `;
            });
        }

        // Filter notes
        window.filterNotes = function() {
            const selectedCategory = document.getElementById('categoryFilter').value;
            
            if (selectedCategory === '') {
                displayNotes(allNotes);
            } else {
                const filtered = allNotes.filter(note => note.category === selectedCategory);
                displayNotes(filtered);
            }
        };

        // Open modal
        window.openModal = function(noteId) {
            const note = allNotes.find(n => n.id === noteId);
            if (!note) return;

            document.getElementById('modalCategory').textContent = note.category;
            document.getElementById('modalTitle').textContent = note.title;
            document.getElementById('modalMeta').innerHTML = `
                <strong>Authors:</strong> ${note.authors}<br>
                <strong>Journal:</strong> ${note.journal}, ${note.year}<br>
                <strong>Published:</strong> ${note.datePublished}
            `;
            document.getElementById('modalBody').textContent = note.content;
            document.getElementById('modalReference').textContent = note.reference;

            document.getElementById('noteModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        };

        // Close modal
        window.closeModal = function() {
            document.getElementById('noteModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        };

        // Close modal on background click
        window.closeModalOnBackground = function(event) {
            if (event.target.id === 'noteModal') {
                closeModal();
            }
        };

        // Initialize
        loadQuote();
        loadNotes();
    </script>
</body>
</html>
