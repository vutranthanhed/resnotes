<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Dr Vu's Research Notes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Georgia, 'Times New Roman', serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .login-box {
            background: white;
            padding: 40px;
            border: 1px solid #ddd;
            max-width: 400px;
            margin: 100px auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .login-box h1 {
            color: #000;
            margin-bottom: 30px;
            text-align: center;
            font-size: 24px;
            font-weight: normal;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
        }
        .admin-panel {
            display: none;
            background: white;
            border: 1px solid #ddd;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .admin-header {
            background: #333;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #000;
        }
        .admin-header h1 {
            font-size: 22px;
            font-weight: normal;
        }
        .tabs {
            display: flex;
            background: #e8e8e8;
            border-bottom: 2px solid #ccc;
        }
        .tab {
            padding: 15px 25px;
            cursor: pointer;
            border: none;
            background: transparent;
            font-size: 15px;
            font-family: Georgia, 'Times New Roman', serif;
            color: #555;
            transition: all 0.2s;
        }
        .tab:hover {
            background: #d5d5d5;
            color: #000;
        }
        .tab.active {
            background: white;
            color: #000;
            border-bottom: 3px solid #000;
            font-weight: bold;
        }
        .tab-content {
            display: none;
            padding: 30px;
        }
        .tab-content.active {
            display: block;
        }
        .tab-content h2 {
            font-size: 20px;
            font-weight: normal;
            border-bottom: 1px solid #ccc;
            padding-bottom: 10px;
            margin-bottom: 25px;
        }
        .tab-content h3 {
            font-size: 18px;
            font-weight: normal;
            color: #555;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: normal;
            color: #000;
            font-size: 14px;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            background: #fafafa;
            font-size: 14px;
            font-family: Georgia, 'Times New Roman', serif;
            color: #333;
        }
        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #666;
            background: white;
        }
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        button {
            background: #333;
            color: white;
            padding: 12px 30px;
            border: 1px solid #000;
            font-size: 14px;
            font-family: Georgia, 'Times New Roman', serif;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            background: #000;
        }
        button.secondary {
            background: #666;
            border-color: #666;
        }
        button.secondary:hover {
            background: #555;
        }
        button.danger {
            background: #fff;
            color: #000;
            border: 1px solid #999;
        }
        button.danger:hover {
            background: #f0f0f0;
            border-color: #666;
        }
        .quote-item,
        .note-item {
            background: #fafafa;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .quote-text {
            flex: 1;
            font-style: italic;
            color: #444;
        }
        .note-info {
            flex: 1;
        }
        .note-info h4 {
            color: #000;
            margin-bottom: 8px;
            font-weight: normal;
            font-size: 16px;
        }
        .note-info p {
            font-size: 13px;
            color: #666;
            margin: 3px 0;
        }
        .note-actions {
            display: flex;
            gap: 10px;
        }
        .success-msg {
            background: #f0f0f0;
            color: #000;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #999;
            border-left: 4px solid #000;
        }
        .error-msg {
            background: #f5f5f5;
            color: #000;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #999;
            border-left: 4px solid #666;
        }
        .category-merge {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            align-items: end;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Box -->
        <div class="login-box" id="loginBox">
            <h1>Admin Login</h1>
            <div id="loginMessage"></div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password">
            </div>
            <button onclick="login()" style="width: 100%;">Log In</button>
        </div>

        <!-- Admin Panel -->
        <div class="admin-panel" id="adminPanel">
            <div class="admin-header">
                <h1>Dr Vu's Research Notes - Admin Panel</h1>
                <button onclick="logout()" class="secondary">Log Out</button>
            </div>

            <div class="tabs">
                <button class="tab active" onclick="switchTab(0)">Quotes Management</button>
                <button class="tab" onclick="switchTab(1)">Publish Research Note</button>
                <button class="tab" onclick="switchTab(2)">View All Notes</button>
            </div>

            <!-- Tab 1: Quotes Management -->
            <div class="tab-content active" id="tab0">
                <h2>Manage Scholar Quotes</h2>
                <div id="quoteMessage"></div>
                
                <div class="form-group">
                    <label>Quote Text</label>
                    <textarea id="quoteText" placeholder="Enter the quote"></textarea>
                </div>
                <div class="form-group">
                    <label>Author</label>
                    <input type="text" id="quoteAuthor" placeholder="Author name">
                </div>
                <button onclick="addQuote()">Add Quote</button>

                <h3 style="margin-top: 40px; margin-bottom: 20px;">Existing Quotes</h3>
                <div id="quotesList"></div>
            </div>

            <!-- Tab 2: Publish Research Note -->
            <div class="tab-content" id="tab1">
                <h2 id="publishTabHeader">Publish Research Note</h2>
                <div id="publishMessage"></div>

                <div class="form-group">
                    <label>Category</label>
                    <div class="category-merge">
                        <div>
                            <select id="categorySelect" onchange="handleCategorySelection()">
                                <option value="">-- Select Existing Category --</option>
                            </select>
                        </div>
                        <div>
                            <input type="text" id="newCategory" placeholder="Or type new category name">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="noteTitle" placeholder="Research note title">
                </div>

                <div class="form-group">
                    <label>Authors</label>
                    <input type="text" id="noteAuthors" placeholder="Author names">
                </div>

                <div class="form-group">
                    <label>Journal</label>
                    <input type="text" id="noteJournal" placeholder="Journal name">
                </div>

                <div class="form-group">
                    <label>Publication Year</label>
                    <input type="number" id="noteYear" placeholder="e.g., 2024" min="1900" max="2100">
                </div>

                <div class="form-group">
                    <label>Full Note</label>
                    <textarea id="noteContent" style="min-height: 200px;" placeholder="Write your research note here"></textarea>
                </div>

                <div class="form-group">
                    <label>Reference</label>
                    <textarea id="noteReference" placeholder="Full citation/reference"></textarea>
                </div>

                <button id="publishBtn" onclick="publishNote()">Publish Note</button>
                <button id="cancelEditBtn" onclick="cancelEdit()" class="secondary" style="display: none; margin-left: 10px;">Cancel Edit</button>
            </div>

            <!-- Tab 3: View All Notes -->
            <div class="tab-content" id="tab2">
                <h2>All Research Notes</h2>
                <div id="allNotesList"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getDatabase, ref, set, push, remove, onValue, get, update } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDhy20YwDQexnH0_qDt7ulbC5aqcnjPPAo",
            authDomain: "drvuresearchnotes.firebaseapp.com",
            databaseURL: "https://drvuresearchnotes-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "drvuresearchnotes",
            storageBucket: "drvuresearchnotes.firebasestorage.app",
            messagingSenderId: "172279052590",
            appId: "1:172279052590:web:215b45beec48acbd86e2bf",
            measurementId: "G-BHDZCJTKS3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        window.db = db;
        window.auth = auth;
        let editingNoteId = null;

        // Check auth state
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadQuotes();
                loadCategories();
                loadAllNotes();
                cleanOldNotes();
            } else {
                document.getElementById('loginBox').style.display = 'block';
                document.getElementById('adminPanel').style.display = 'none';
            }
        });

        // Login
        window.login = async function() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const messageDiv = document.getElementById('loginMessage');

            try {
                await signInWithEmailAndPassword(auth, email, password);
                messageDiv.innerHTML = '<div class="success-msg">Login successful!</div>';
            } catch (error) {
                messageDiv.innerHTML = `<div class="error-msg">Login failed: ${error.message}</div>`;
            }
        };

        // Logout
        window.logout = async function() {
            await signOut(auth);
        };

        // Tab switching
        window.switchTab = function(index) {
            const tabs = document.querySelectorAll('.tab');
            const contents = document.querySelectorAll('.tab-content');
            
            tabs.forEach(t => t.classList.remove('active'));
            contents.forEach(c => c.classList.remove('active'));
            
            tabs[index].classList.add('active');
            contents[index].classList.add('active');

            if (index === 1) loadCategories();
            if (index === 2) loadAllNotes();
        };

        // Add Quote
        window.addQuote = async function() {
            const text = document.getElementById('quoteText').value.trim();
            const author = document.getElementById('quoteAuthor').value.trim();
            const messageDiv = document.getElementById('quoteMessage');

            if (!text || !author) {
                messageDiv.innerHTML = '<div class="error-msg">Please fill in both fields.</div>';
                return;
            }

            try {
                const quotesRef = ref(db, 'quotes');
                await push(quotesRef, { text, author });
                messageDiv.innerHTML = '<div class="success-msg">Quote added successfully!</div>';
                document.getElementById('quoteText').value = '';
                document.getElementById('quoteAuthor').value = '';
                loadQuotes();
            } catch (error) {
                messageDiv.innerHTML = `<div class="error-msg">Error: ${error.message}</div>`;
            }
        };

        // Load Quotes
        window.loadQuotes = function() {
            const quotesRef = ref(db, 'quotes');
            onValue(quotesRef, (snapshot) => {
                const quotesDiv = document.getElementById('quotesList');
                quotesDiv.innerHTML = '';

                if (snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const quote = child.val();
                        const quoteId = child.key;
                        quotesDiv.innerHTML += `
                            <div class="quote-item">
                                <div class="quote-text">
                                    "${quote.text}" <br><strong>— ${quote.author}</strong>
                                </div>
                                <button class="danger" onclick="deleteQuote('${quoteId}')">Delete</button>
                            </div>
                        `;
                    });
                } else {
                    quotesDiv.innerHTML = '<p>No quotes yet.</p>';
                }
            });
        };

        // Delete Quote
        window.deleteQuote = async function(quoteId) {
            if (confirm('Delete this quote?')) {
                await remove(ref(db, `quotes/${quoteId}`));
                loadQuotes();
            }
        };

        // Load Categories
        window.loadCategories = function() {
            const notesRef = ref(db, 'notes');
            get(notesRef).then((snapshot) => {
                const categories = new Set();
                if (snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const note = child.val();
                        if (note.category) categories.add(note.category);
                    });
                }

                const select = document.getElementById('categorySelect');
                const currentValue = select.value;
                select.innerHTML = '<option value="">-- Select Existing Category --</option>';
                
                Array.from(categories).sort().forEach(cat => {
                    select.innerHTML += `<option value="${cat}">${cat}</option>`;
                });
                
                if (currentValue) select.value = currentValue;
            });
        };

        // Handle category selection
        window.handleCategorySelection = function() {
            const select = document.getElementById('categorySelect');
            const newInput = document.getElementById('newCategory');
            
            if (select.value) {
                newInput.value = '';
                newInput.disabled = true;
            } else {
                newInput.disabled = false;
            }
        };

        // Edit Note
        window.editNote = async function(noteId) {
            const noteRef = ref(db, `notes/${noteId}`);
            const snapshot = await get(noteRef);
            
            if (snapshot.exists()) {
                const note = snapshot.val();
                editingNoteId = noteId;

                const select = document.getElementById('categorySelect');
                let categoryExists = Array.from(select.options).some(opt => opt.value === note.category);

                if (categoryExists) {
                    select.value = note.category;
                    document.getElementById('newCategory').value = '';
                    document.getElementById('newCategory').disabled = true;
                } else {
                    select.value = '';
                    document.getElementById('newCategory').value = note.category;
                    document.getElementById('newCategory').disabled = false;
                }

                document.getElementById('noteTitle').value = note.title;
                document.getElementById('noteAuthors').value = note.authors;
                document.getElementById('noteJournal').value = note.journal;
                document.getElementById('noteYear').value = note.year;
                document.getElementById('noteContent').value = note.content;
                document.getElementById('noteReference').value = note.reference;

                document.getElementById('publishTabHeader').textContent = 'Edit Research Note';
                document.getElementById('publishBtn').textContent = 'Update Note';
                document.getElementById('cancelEditBtn').style.display = 'inline-block';
                document.getElementById('publishMessage').innerHTML = '';
                
                switchTab(1);
            }
        };

        // Cancel Edit
        window.cancelEdit = function() {
            editingNoteId = null;
            document.getElementById('publishTabHeader').textContent = 'Publish Research Note';
            document.getElementById('publishBtn').textContent = 'Publish Note';
            document.getElementById('cancelEditBtn').style.display = 'none';
            
            document.getElementById('categorySelect').value = '';
            document.getElementById('newCategory').value = '';
            document.getElementById('newCategory').disabled = false;
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteAuthors').value = '';
            document.getElementById('noteJournal').value = '';
            document.getElementById('noteYear').value = '';
            document.getElementById('noteContent').value = '';
            document.getElementById('noteReference').value = '';
            document.getElementById('publishMessage').innerHTML = '';
        };

        // Publish or Update Note
        window.publishNote = async function() {
            const selectedCategory = document.getElementById('categorySelect').value;
            const newCategory = document.getElementById('newCategory').value.trim();
            const category = newCategory || selectedCategory;
            
            const title = document.getElementById('noteTitle').value.trim();
            const authors = document.getElementById('noteAuthors').value.trim();
            const journal = document.getElementById('noteJournal').value.trim();
            const year = document.getElementById('noteYear').value.trim();
            const content = document.getElementById('noteContent').value.trim();
            const reference = document.getElementById('noteReference').value.trim();
            
            const messageDiv = document.getElementById('publishMessage');

            if (!category || !title || !authors || !journal || !year || !content || !reference) {
                messageDiv.innerHTML = '<div class="error-msg">Please fill in all fields.</div>';
                return;
            }

            try {
                if (editingNoteId) {
                    const noteRef = ref(db, `notes/${editingNoteId}`);
                    await update(noteRef, {
                        category,
                        title,
                        authors,
                        journal,
                        year,
                        content,
                        reference
                    });
                    messageDiv.innerHTML = '<div class="success-msg">Research note updated successfully!</div>';
                    window.cancelEdit();
                } else {
                    const notesRef = ref(db, 'notes');
                    const newNote = {
                        category,
                        title,
                        authors,
                        journal,
                        year,
                        content,
                        reference,
                        timestamp: Date.now(),
                        datePublished: new Date().toISOString().split('T')[0]
                    };

                    await push(notesRef, newNote);
                    messageDiv.innerHTML = '<div class="success-msg">Research note published successfully!</div>';
                    window.cancelEdit();
                }
                loadCategories();
            } catch (error) {
                messageDiv.innerHTML = `<div class="error-msg">Error: ${error.message}</div>`;
            }
        };

        // Load All Notes
        window.loadAllNotes = function() {
            const notesRef = ref(db, 'notes');
            onValue(notesRef, (snapshot) => {
                const notesDiv = document.getElementById('allNotesList');
                notesDiv.innerHTML = '';

                if (snapshot.exists()) {
                    const notes = [];
                    snapshot.forEach((child) => {
                        notes.push({ id: child.key, ...child.val() });
                    });

                    notes.sort((a, b) => b.timestamp - a.timestamp);

                    notes.forEach(note => {
                        notesDiv.innerHTML += `
                            <div class="note-item">
                                <div class="note-info">
                                    <h4>${note.title}</h4>
                                    <p><strong>Category:</strong> ${note.category}</p>
                                    <p><strong>Authors:</strong> ${note.authors}</p>
                                    <p><strong>Journal:</strong> ${note.journal} (${note.year})</p>
                                    <p><strong>Published:</strong> ${note.datePublished}</p>
                                </div>
                                <div class="note-actions">
                                    <button class="secondary" onclick="editNote('${note.id}')">Edit</button>
                                    <button class="danger" onclick="deleteNote('${note.id}')">Delete</button>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    notesDiv.innerHTML = '<p>No notes yet.</p>';
                }
            });
        };

        // Delete Note
        window.deleteNote = async function(noteId) {
            if (confirm('Delete this note? This cannot be undone.')) {
                await remove(ref(db, `notes/${noteId}`));
                loadAllNotes();
            }
        };

        // Clean notes older than 30 days
        window.cleanOldNotes = async function() {
            const notesRef = ref(db, 'notes');
            const snapshot = await get(notesRef);
            
            if (snapshot.exists()) {
                const thirtyDaysAgo = Date.now() - (30 * 24 * 60 * 60 * 1000);
                
                snapshot.forEach((child) => {
                    const note = child.val();
                    if (note.timestamp < thirtyDaysAgo) {
                        remove(ref(db, `notes/${child.key}`));
                    }
                });
            }
        };
    </script>
</body>
</html>
